<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4a0"/>
      <stop offset="100%" stop-color="#2fe3b6"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- corner brackets -->
  <path d="M 40 40 L 40 70 M 40 40 L 70 40" stroke="#00d4a0" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M 1160 590 L 1160 560 M 1160 590 L 1130 590" stroke="#00d4a0" stroke-opacity="0.4" stroke-width="2" fill="none"/>

  <!-- index -->
  <text x="80" y="120" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="#616b7b" letter-spacing="3">ENGINEERING INTELLIGENCE PROFILE</text>

  <!-- name -->
  <text x="80" y="220" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="700" fill="#e8ebf0" letter-spacing="-2">Ganesh Kumar</text>

  <!-- title -->
  <text x="80" y="280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" fill="url(#accent)">Lead AI &amp; Full Stack Engineer</text>

  <!-- tagline -->
  <text x="80" y="340" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#99a2b0">13+ years · Banking &amp; Capital Markets · Singapore</text>

  <!-- tech chips -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="#2fe3b6">
    <rect x="80" y="400" width="90" height="32" rx="6" fill="#00d4a0" fill-opacity="0.12" stroke="#00d4a0" stroke-opacity="0.32"/>
    <text x="125" y="421" text-anchor="middle">Java 25</text>
    <rect x="184" y="400" width="120" height="32" rx="6" fill="#00d4a0" fill-opacity="0.12" stroke="#00d4a0" stroke-opacity="0.32"/>
    <text x="244" y="421" text-anchor="middle">Spring Boot 3</text>
    <rect x="318" y="400" width="70" height="32" rx="6" fill="#00d4a0" fill-opacity="0.12" stroke="#00d4a0" stroke-opacity="0.32"/>
    <text x="353" y="421" text-anchor="middle">Rust</text>
    <rect x="402" y="400" width="80" height="32" rx="6" fill="#00d4a0" fill-opacity="0.12" stroke="#00d4a0" stroke-opacity="0.32"/>
    <text x="442" y="421" text-anchor="middle">React 19</text>
    <rect x="496" y="400" width="70" height="32" rx="6" fill="#00d4a0" fill-opacity="0.12" stroke="#00d4a0" stroke-opacity="0.32"/>
    <text x="531" y="421" text-anchor="middle">Kafka</text>
    <rect x="580" y="400" width="100" height="32" rx="6" fill="#00d4a0" fill-opacity="0.12" stroke="#00d4a0" stroke-opacity="0.32"/>
    <text x="630" y="421" text-anchor="middle">Snowflake</text>
  </g>

  <!-- AI chips -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="#a3b1ff">
    <rect x="80" y="448" width="60" height="32" rx="6" fill="#8b9dff" fill-opacity="0.12" stroke="#8b9dff" stroke-opacity="0.32"/>
    <text x="110" y="469" text-anchor="middle">LLM</text>
    <rect x="154" y="448" width="60" height="32" rx="6" fill="#8b9dff" fill-opacity="0.12" stroke="#8b9dff" stroke-opacity="0.32"/>
    <text x="184" y="469" text-anchor="middle">RAG</text>
    <rect x="228" y="448" width="80" height="32" rx="6" fill="#8b9dff" fill-opacity="0.12" stroke="#8b9dff" stroke-opacity="0.32"/>
    <text x="268" y="469" text-anchor="middle">Agents</text>
    <rect x="322" y="448" width="100" height="32" rx="6" fill="#8b9dff" fill-opacity="0.12" stroke="#8b9dff" stroke-opacity="0.32"/>
    <text x="372" y="469" text-anchor="middle">Claude AI</text>
    <rect x="436" y="448" width="110" height="32" rx="6" fill="#8b9dff" fill-opacity="0.12" stroke="#8b9dff" stroke-opacity="0.32"/>
    <text x="491" y="469" text-anchor="middle">Cortex AI</text>
  </g>

  <!-- bottom bar -->
  <rect x="80" y="540" width="1040" height="1" fill="#ffffff" fill-opacity="0.07"/>
  <text x="80" y="575" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="#616b7b">Bank of Julius Baer · BNY · BITS Pilani M.Tech AI/ML</text>
</svg>
